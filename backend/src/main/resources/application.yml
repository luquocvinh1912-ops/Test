server:
  port: 8080

spring:
  application:
    name: vending-machine
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vending_dev}
    username: ${DATABASE_USER:vending}
    password: ${DATABASE_PASSWORD:vending}

mqtt:
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:vending-backend-dev}
